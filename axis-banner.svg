<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="50%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe29d"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232328" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Фон и кибер-сетка -->
  <rect width="1500" height="500" fill="url(#bannerBg)"/>
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.4"/>

  <!-- Декоративные световые лучи -->
  <circle cx="1100" cy="250" r="300" fill="#c5a059" opacity="0.05" filter="blur(60px)"/>

  <!-- Текстовый блок -->
  <g transform="translate(150, 200)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-weight="900" font-size="76" fill="url(#goldText)" letter-spacing="8">$AXIS PROTOCOL</text>
    <text x="0" y="55" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" fill="#8e8e93" letter-spacing="4">AUTONOMOUS VOLUME FLYWHEEL // SOLANA TOKEN-2022</text>
  </g>

  <!-- Миникарта параметров справа -->
  <g transform="translate(1050, 160)" font-family="monospace" font-size="14" fill="#8e8e93">
    <rect x="-20" y="-20" width="320" height="180" rx="12" fill="#16161a" stroke="#232328" stroke-width="2"/>
    <text x="0" y="20" fill="#c5a059" font-weight="bold">[ PROTOCOL METRICS ]</text>
    <text x="0" y="60">TAX FEE: <tspan fill="#f4f4f5">0.1% FIXED</tspan></text>
    <text x="0" y="90">BURN RATE: <tspan fill="#f4f4f5">60% AUTOMATIC</tspan></text>
    <text x="0" y="120">BOUNTY: <tspan fill="#4ade80">15% PUBLIC CRANK</tspan></text>
  </g>
</svg>
