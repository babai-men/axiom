<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Solana Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Small p bottom-left -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#solanaGrad)">
    p
  </text>

  <!-- Big QT center -->
  <text x="180" y="300" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="url(#solanaGrad)">
    QT
  </text>

  <!-- Flame inside Q -->
  <path d="M 220 180 
           C 210 200, 205 215, 205 230 
           C 205 245, 215 255, 220 255 
           C 230 255, 240 245, 240 230 
           C 240 215, 230 200, 220 180 Z"
        fill="url(#flameGrad)">
    <!-- Animation -->
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="fill" values="#9945FF;#00F2FE;#FFFFFF;#9945FF" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
