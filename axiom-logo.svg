<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solana Brand Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="url(#solanaGrad)" stroke-width="4"/>

  <!-- Monogram P -->
  <g filter="url(#neonGlow)">
    <path d="M 180 380 
             L 180 150 
             C 180 120, 220 95, 270 95 
             C 330 95, 370 135, 370 195 
             C 370 255, 330 295, 270 295 
             L 230 295 
             L 230 380 Z"
          fill="none"
          stroke="url(#solanaGrad)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Flame inside P loop -->
    <path d="M 275 160 
             C 265 180, 260 195, 260 210 
             C 260 225, 270 235, 275 235 
             C 285 235, 295 225, 295 210 
             C 295 195, 285 180, 275 160 Z"
          fill="url(#flameGrad)">
      <!-- Animation for flame -->
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="fill" values="#9945FF;#00F2FE;#FFFFFF;#9945FF" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- QT Letters -->
  <text x="290" y="390" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#solanaGrad)">
    QT
  </text>
</svg>
