<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Градиент общего фона -->
    <radialGradient id="bg-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A150A" />
      <stop offset="60%" stop-color="#08090B" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Акцентные градиенты -->
    <linearGradient id="b-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D97A" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>

    <linearGradient id="b-ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#E2623D" />
    </linearGradient>

    <linearGradient id="b-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82E6AB" />
      <stop offset="100%" stop-color="#6FCF97" />
    </linearGradient>

    <!-- Сетка технологического фона -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#24262B" stroke-width="0.7" opacity="0.4"/>
    </pattern>

    <!-- Фильтр неонового свечения -->
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Декоративные свечения -->
  <circle cx="260" cy="315" r="280" fill="#C9A227" opacity="0.06" filter="blur(60px)" />
  <circle cx="260" cy="315" r="180" fill="#E2623D" opacity="0.08" filter="blur(40px)" />

  <!-- ЛЕВЫЙ БЛОК: Крупный 3D-маховик (r=140, C ≈ 879.64px) -->
  <g transform="translate(260, 315)">
    <!-- Фоновые кольца -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#24262B" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="140" fill="#101113" stroke="#1B1C20" stroke-width="12"/>

    <!-- Сегменты маховика (rotate -90 deg) -->
    <g transform="rotate(-90)">
      <!-- 70% Burn (Ember) = 615.75px -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#b-ember)" stroke-width="14" 
              stroke-dasharray="615.75 879.64" stroke-dashoffset="0" stroke-linecap="round" filter="url(#banner-glow)"/>
      
      <!-- 20% Bounty (Mint) = 175.93px -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#b-mint)" stroke-width="14" 
              stroke-dasharray="175.93 879.64" stroke-dashoffset="-615.75" stroke-linecap="round"/>
      
      <!-- 10% Dev Treasury (Gold) = 87.96px -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#b-gold)" stroke-width="14" 
              stroke-dasharray="87.96 879.64" stroke-dashoffset="-791.68" stroke-linecap="round"/>
    </g>

    <!-- Центральная эмблема Delta -->
    <g filter="url(#banner-glow)">
      <path d="M0 -65 L70 70 H35 L0 -5 L-35 70 H-70 Z" fill="url(#b-gold)" />
      <path d="M-22 25 H22 V37 H-22 Z" fill="url(#b-ember)" />
      <path d="M0 -30 L20 15 H-20 Z" fill="#101113" />
    </g>
  </g>

  <!-- ПРАВЫЙ БЛОК: Информационная панель и типографика -->
  
  <!-- Бейдж стандарта -->
  <g transform="translate(530, 135)">
    <rect width="260" height="32" rx="16" fill="rgba(201, 162, 39, 0.1)" stroke="rgba(201, 162, 39, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#6FCF97"/>
    <text x="30" y="21" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#F0D97A" letter-spacing="1">SOLANA TOKEN-2022</text>
  </g>

  <!-- Главный заголовок -->
  <text x="530" y="225" font-family="'Space Grotesk', sans-serif" font-size="58" font-weight="800" fill="#F2F1EE" letter-spacing="-1">AXIOM PROTOCOL</text>
  <text x="530" y="265" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#C9A227" letter-spacing="2">AUTONOMOUS VOLUME FLYWHEEL</text>

  <!-- Описание -->
  <text x="530" y="305" font-family="'Inter', sans-serif" font-size="15" fill="#8C8D93" width="580">
    Самоподдерживающийся DeFi-протокол с нативной фиксированной комиссией 0.05%,
  </text>
  <text x="530" y="327" font-family="'Inter', sans-serif" font-size="15" fill="#8C8D93">
    обеспечивающей непрерывную дефляцию и вознаграждения за вызов Crank.
  </text>

  <!-- Карточки токеномики (70 / 20 / 10) -->
  <g transform="translate(530, 365)">
    <!-- 70% Burn -->
    <rect x="0" y="0" width="180" height="95" rx="12" fill="#101113" stroke="#24262B" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#E2623D"/>
    <text x="16" y="38" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#FF7A59">70%</text>
    <text x="16" y="60" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F1EE">Burn</text>
    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#8C8D93">Сжигание из эмиссии</text>

    <!-- 20% Bounty -->
    <rect x="195" y="0" width="180" height="95" rx="12" fill="#101113" stroke="#24262B" stroke-width="1"/>
    <rect x="195" y="0" width="180" height="3" rx="1.5" fill="#6FCF97"/>
    <text x="211" y="38" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#82E6AB">20%</text>
    <text x="211" y="60" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F1EE">Public Bounty</text>
    <text x="211" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#8C8D93">Награда MEV / Crank</text>

    <!-- 10% Dev Vault -->
    <rect x="390" y="0" width="180" height="95" rx="12" fill="#101113" stroke="#24262B" stroke-width="1"/>
    <rect x="390" y="0" width="180" height="3" rx="1.5" fill="#C9A227"/>
    <text x="406" y="38" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#F0D97A">10%</text>
    <text x="406" y="60" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F1EE">Dev Treasury</text>
    <text x="406" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#8C8D93">Инфраструктура</text>
  </g>

  <!-- Нижняя плашка безопасности -->
  <g transform="translate(530, 500)">
    <line x1="0" y1="0" x2="570" y2="0" stroke="#1B1C20" stroke-width="1"/>
    <text x="0" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5C5D63">
      MINT &amp; FREEZE: REVOKED  |  FEE: 0.05% FIXED  |  LP: METEORA DLMM LOCKED
    </text>
  </g>
</svg>
